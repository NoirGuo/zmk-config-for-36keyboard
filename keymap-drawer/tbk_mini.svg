<svg width="864" height="403" viewBox="0 0 864 403" class="keymap" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<style>/* inherit to force styles through use tags */
svg path {
    fill: inherit;
}

/* font and background color specifications */
svg.keymap {
    font-family: SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;
    font-size: 14px;
    font-kerning: normal;
    text-rendering: optimizeLegibility;
    fill: #24292e;
}

/* default key styling */
rect.key {
    fill: #f6f8fa;
}

rect.key, rect.combo {
    stroke: #c9cccf;
    stroke-width: 1;
}

/* default key side styling, only used is draw_key_sides is set */
rect.side {
    filter: brightness(90%);
}

/* color accent for combo boxes */
rect.combo, rect.combo-separate {
    fill: #cdf;
}

/* color accent for held keys */
rect.held, rect.combo.held {
    fill: #fdd;
}

/* color accent for ghost (optional) keys */
rect.ghost, rect.combo.ghost {
    stroke-dasharray: 4, 4;
    stroke-width: 2;
}

text {
    text-anchor: middle;
    dominant-baseline: middle;
}

/* styling for layer labels */
text.label {
    font-weight: bold;
    text-anchor: start;
    stroke: white;
    stroke-width: 4;
    paint-order: stroke;
}

/* styling for optional footer */
text.footer {
    text-anchor: end;
    dominant-baseline: auto;
    stroke: white;
    stroke-width: 4;
    paint-order: stroke;
}

/* styling for combo tap, and key non-tap label text */
text.combo, text.hold, text.shifted, text.left, text.right, text.tl, text.tr, text.bl, text.br {
    font-size: 11px;
}

text.hold, text.bl, text.br {
    text-anchor: middle;
    dominant-baseline: auto;
}

text.shifted, text.tl, text.tr {
    text-anchor: middle;
    dominant-baseline: hanging;
}

text.left, text.tl, text.bl {
    text-anchor: start;
}

text.right, text.tr, text.br {
    text-anchor: end;
}

text.layer-activator {
    text-decoration: underline;
}

/* styling for hold/shifted label text in combo box */
text.combo.hold, text.combo.shifted, text.combo.left, text.combo.right {
    font-size: 8px;
}

/* lighter symbol for transparent keys */
text.trans {
    fill: #7b7e81;
}

/* styling for combo dendrons */
path.combo {
    stroke-width: 1;
    stroke: gray;
    fill: none;
}

/* Start Tabler Icons Cleanup */
/* cannot use height/width with glyphs */
.icon-tabler > path {
    fill: inherit;
    stroke: inherit;
    stroke-width: 2;
}
/* hide tabler's default box */
.icon-tabler > path[stroke="none"][fill="none"] {
    visibility: hidden;
}
/* End Tabler Icons Cleanup */

/* For default styles, see https://github.com/caksoylar/keymap-drawer/blob/main/keymap_drawer/config.py#L85 */

svg.keymap {
  font-family: Ubuntu Mono, Inconsolata, Consolas, Liberation Mono, Menlo, monospace;
  font-size: 12px;
  font-weight: bold;
  text-rendering: optimizeLegibility;
}

/* Color accent for held keys */
rect.held, rect.combo.held {
    fill: #ffc;
}

.sym_sub_text.tap {
  translate: -5px 2px;
  font-size: 20px;
}
.sym_sub_text.shifted {
  translate: 10px 13px;
  font-size: 10px;
  opacity: 1.0;
}
.combo.sym_sub_text.tap {
  translate: -1px 1px;
}
.combo.sym_sub_text.shifted {
  translate: 7px 5px;
  font-size: 10px;
  opacity: 1.0;
}

.toggle.shifted {
  translate: -10px 12px;
}

.toggle.hold {
  translate: 13px -23px;
}

.tap_dance.tap {
  translate: -7px 0px;
  font-size: 12px;
}
.tap_dance.shifted {
  translate: 7px 17px;
  font-size: 12px;
  opacity: 1.0;
}

.sym_by_sym.tap {
  translate: -6px 0px;
}
.sym_by_sym.shifted {
  translate: 10px 12px;
  opacity: 1.0;
}

.combo.sym_by_sym.tap {
  translate: -35px 0px;
}
.combo.sym_by_sym.shifted {
  translate: 35px 20px;
  opacity: 1.0;
}

.combo.sym_by_sym.hold {
  visibility: hidden;
}
</style>
